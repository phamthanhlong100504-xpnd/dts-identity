services:
  identity-service:
    image: ghcr.io/phamthanhlong100504-xpnd/identity-service:latest
    container_name: dts-identity-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx256m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -Xss512k
      - EUREKA_URI=http://eureka-server:8761/eureka/
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=dts_identity
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-uPq3xK8mR5vY2wZ9aB4cD7eF1gH3iJ6kL0nO5pQ8rS2tU4vW6xY9zA1bC3dE7fG9}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-jI0hG9fE8dC7bA6zY5xW4vU3tS2rQ1pO0nM9lK8jI7hG6fE5dC4bA3zY2xW1vU0}
      - KAFKA_BOOTSTRAP_SERVERS=media-kafka:9092
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST:-smtp.gmail.com}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT:-587}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME:-noreply@dts.com}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD:-REMOVED_SECRET}
      - APP_MAIL_ENABLED=${APP_MAIL_ENABLED:-true}
      - APP_MAIL_FROM=${APP_MAIL_FROM:-noreply@dts.com}
      - APP_MAIL_SENDER_NAME=${APP_MAIL_SENDER_NAME:-DTS Identity}
    mem_limit: 400m
    networks:
      - dts-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - dts-network

networks:
  dts-network:
    external: true
