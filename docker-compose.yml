services:
  identity-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dts-identity-service
    ports:
      - "${SERVER_PORT:-8081}:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-dts_identity}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_URI=${EUREKA_URI:-http://eureka-server:8761/eureka}
      - EUREKA_ENABLED=${EUREKA_ENABLED:-false}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-uPq3xK8mR5vY2wZ9aB4cD7eF1gH3iJ6kL0nO5pQ8rS2tU4vW6xY9zA1bC3dE7fG9}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-jI0hG9fE8dC7bA6zY5xW4vU3tS2rQ1pO0nM9lK8jI7hG6fE5dC4bA3zY2xW1vU0}
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST:-smtp.gmail.com}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT:-587}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME:-noreply@dts.com}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD:-REMOVED_SECRET}
      - APP_MAIL_ENABLED=${APP_MAIL_ENABLED:-true}
      - APP_MAIL_FROM=${APP_MAIL_FROM:-noreply@dts.com}
      - APP_MAIL_SENDER_NAME=${APP_MAIL_SENDER_NAME:-DTS Identity}
    depends_on:
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dts-network

  postgres:
    image: postgres:16-alpine
    container_name: dts-identity-postgres
    ports:
      - "${DB_EXTERNAL_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-dts_identity}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-dts_identity}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - dts-network

  redis:
    image: redis:7-alpine
    container_name: dts-identity-redis
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - dts-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: dts-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    restart: unless-stopped
    networks:
      - dts-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: dts-kafka
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    depends_on:
      - zookeeper
    healthcheck:
      test: [ "CMD", "sh", "-c", "kafka-broker-api-versions --bootstrap-server=localhost:9092 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - dts-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dts-pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@dts.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - dts-network
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  kafka_data:
  pgadmin_data:

networks:
  dts-network:
    driver: bridge