name: CI - Identity Service

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - 'plan/**'
      - '*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==================== Build & Test ====================
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dts_identity_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dts_identity_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn verify -B 
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: dts_identity_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/

  # ==================== Docker Build & Push ====================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build
    
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== Validate Docs ====================
  docs:
    name: Validate API & DB Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify docs structure
        run: |
          echo "=== Checking standard directories ==="
          test -d docs/api-blueprint || { echo "MISSING: docs/api-blueprint"; exit 1; }
          test -d docs/db || { echo "MISSING: docs/db"; exit 1; }
          test -d plan || { echo "MISSING: plan"; exit 1; }
          echo "=== Checking api-blueprint files ==="
          ls -la docs/api-blueprint/
          echo "=== Checking db files ==="
          ls -la docs/db/
          echo "=== All checks passed ==="
